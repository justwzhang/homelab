services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped

    environment:
      TZ: America/New_York
      WEBPASSWORD: ${PASSWORD}

    volumes:
      - /srv/storage/NAS/docker-meta/pihole/etc-pihole:/etc/pihole
      - /srv/storage/NAS/docker-meta/pihole/etc-dnsmasq.d:/etc/dnsmasq.d

    ports:
      - "8090:80"
      - "1053:53/tcp"
      - "1053:53/udp"